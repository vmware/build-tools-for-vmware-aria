vars:
    archetype:
        group_id: archetype.group.id                # Stores the archetype group ID in cmd for generating project from archetype
        artifact_id: archetype.artifact.id          # Stores the archetype artifact ID in cmd for generating project from archetype
    project:
        artifact_id: project.artifact.id            # Stores the artifact ID of the generated project (per product)
        type: project type name                     # Stores the name of the project type (per product)
        product_type: vro                           # Stores the identifier of "vro" product for project types. Values are "vro" | "non-vro"
        workflows_path: project_workflows_path      # Stores the path to workflows in XML vro project - required in cmd for generating the project
    maven:
        goal: vcfa-all-apps                         # Stores the goal for Maven commands
        property_prefix: prefix                     # Stores the prefix of properties per product (WITHOUT underscore)
        installer_directory_name: dir_name          # Stores the name of the directory per product that the installer expects
        installer_file_extension: ext               # Stores the extension of package files (without the dot) per product that the installer expects

